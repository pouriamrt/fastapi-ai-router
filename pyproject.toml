[project]
name = "fastapi-ai-router"
version = "0.1.0.dev0"
description = "FastAPI middleware that turns your routes into a natural-language-callable surface using LLM function-calling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pouria" }]
keywords = ["fastapi", "llm", "ai", "router", "middleware", "function-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "litellm>=1.40",
]

[project.urls]
Homepage = "https://github.com/pouria/fastapi-ai-router"
Issues = "https://github.com/pouria/fastapi-ai-router/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_ai_router"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/fastapi_ai_router/errors.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/fastapi_ai_router"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end test against a real LLM (gated by RUN_LLM_TESTS=1)",
]

[tool.coverage.run]
source = ["src/fastapi_ai_router"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
