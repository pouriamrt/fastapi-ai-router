[project]
name = "fastapi-ai-router"
version = "0.1.0"
description = "FastAPI middleware that turns your routes into a natural-language-callable surface using LLM function-calling."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Pouria" }]
keywords = ["fastapi", "llm", "ai", "router", "middleware", "function-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
jev = ["typesafe-sdk>=0.7.1"]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
    "litellm>=1.40",
    "python-multipart>=0.0.32",
    "typesafe-sdk>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/pouriamrt/fastapi-ai-router"
Documentation = "https://github.com/pouriamrt/fastapi-ai-router#readme"
Issues = "https://github.com/pouriamrt/fastapi-ai-router/issues"
Changelog = "https://github.com/pouriamrt/fastapi-ai-router/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_ai_router"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["examples", "docs/superpowers"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/fastapi_ai_router/errors.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/fastapi_ai_router"]
warn_unused_ignores = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "e2e: end-to-end test against a real LLM (gated by RUN_LLM_TESTS=1)",
]

[tool.coverage.run]
source = ["src/fastapi_ai_router"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
